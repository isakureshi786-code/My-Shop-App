  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker Registration for PWA & Offline Support
      if ('serviceWorker' in navigator) {
        // In AI Studio preview / iframe environment, clean up service worker to prevent cross-origin iframe fetch errors
        const isPreviewIframe = window.self !== window.top;
        if (isPreviewIframe) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister().catch(() => {});
            }
          }).catch(() => {});
        } else {
          // Direct browser visits / PWA / mobile standalone mode
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then((reg) => {
                if (reg) {
                  // Safely call update with error catch
                  reg.update().catch(() => {});
                  reg.onupdatefound = () => {
                    const installing = reg.installing;
                    if (installing) {
                      installing.onstatechange = () => {
                        if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                          console.log('[SW] New version available, reloading...');
                          window.location.reload();
                        }
                      };
                    }
                  };
                }
              })
              .catch(() => {});
          });
        }
      }
    </script>
  </body>
